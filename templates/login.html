<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 东华住院工作量查询 v2.1</title>
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --success: #28a745;
            --danger: #dc3545;
            --text: #333;
            --text-light: #666;
            --bg-light: #f8f9fa;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
        }
        .login-container {
            width: 400px;
            max-width: 90%;
        }
        .login-box {
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h1 {
            font-size: 1.8em;
            color: var(--primary);
            margin-bottom: 8px;
        }
        .login-header p {
            color: var(--text-light);
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-light);
            font-weight: 600;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            transition: border-color 0.2s;
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary);
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        .links {
            text-align: center;
            margin-top: 20px;
        }
        .links a {
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
        }
        .links a:hover {
            text-decoration: underline;
        }
        .error-msg {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
            display: none;
        }
        .error-msg.show {
            display: block;
        }
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        .loading.show {
            display: block;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .footer {
            text-align: center;
            color: rgba(255,255,255,0.7);
            margin-top: 20px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>东华住院工作量查询</h1>
                <p>请登录以继续</p>
            </div>
            
            <div class="error-msg" id="errorMsg"></div>
            
            <form id="loginForm" onsubmit="return handleLogin(event)">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="username" placeholder="请输入用户名" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" placeholder="请输入密码" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary" id="btnLogin">登录</button>
            </form>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
            </div>
            
            <div class="links">
                <a href="register.html">还没有账号？立即注册</a>
            </div>
        </div>
        
        <div class="footer">
            Powered by Python Flask
        </div>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        const $show = el => el.classList.add('show');
        const $hide = el => el.classList.remove('show');

        async function handleLogin(e) {
            e.preventDefault();
            
            const username = $('username').value.trim();
            const password = $('password').value;
            
            if (!username || !password) {
                $('errorMsg').textContent = '请输入用户名和密码';
                $show($('errorMsg'));
                return false;
            }
            
            $hide($('errorMsg'));
            $('btnLogin').disabled = true;
            $('loginForm').style.display = 'none';
            $show($('loading'));
            
            try {
                const res = await fetch('/api/session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                
                if (data.success) {
                    window.location.href = '/main';
                } else {
                    $('errorMsg').textContent = data.message;
                    $show($('errorMsg'));
                    $('btnLogin').disabled = false;
                    $('loginForm').style.display = 'block';
                    $hide($('loading'));
                }
            } catch (err) {
                $('errorMsg').textContent = '登录失败，请稍后重试';
                $show($('errorMsg'));
                $('btnLogin').disabled = false;
                $('loginForm').style.display = 'block';
                $hide($('loading'));
            }
            
            return false;
        }

        // 回车登录
        document.addEventListener('keypress', e => {
            if (e.key === 'Enter') handleLogin(e);
        });
    </script>
</body>
</html>
