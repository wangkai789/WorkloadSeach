<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 东华住院工作量查询</title>
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --success: #28a745;
            --danger: #dc3545;
            --text: #333;
            --text-light: #666;
            --bg-light: #f8f9fa;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            padding: 20px;
        }
        .register-container {
            width: 480px;
            max-width: 100%;
        }
        .register-box {
            background: white;
            border-radius: 16px;
            padding: 35px 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .register-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .register-header h1 {
            font-size: 1.6em;
            color: var(--primary);
            margin-bottom: 8px;
        }
        .register-header p {
            color: var(--text-light);
            font-size: 14px;
        }
        .form-row {
            display: flex;
            gap: 15px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-light);
            font-weight: 600;
            font-size: 13px;
        }
        .form-group label .required {
            color: var(--danger);
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
        }
        .form-hint {
            font-size: 11px;
            color: var(--text-light);
            margin-top: 4px;
        }
        .form-section {
            background: var(--bg-light);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .form-section-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }
        .links {
            text-align: center;
            margin-top: 18px;
        }
        .links a {
            color: var(--primary);
            text-decoration: none;
            font-size: 14px;
        }
        .links a:hover {
            text-decoration: underline;
        }
        .btn-outline {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            text-decoration: none;
            display: inline-block;
        }
        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }
        .error-msg, .success-msg {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            text-align: center;
            font-size: 14px;
            display: none;
        }
        .error-msg {
            background: #f8d7da;
            color: #721c24;
        }
        .error-msg.show { display: block; }
        .success-msg {
            background: #d4edda;
            color: #155724;
        }
        .success-msg.show { display: block; }
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        .loading.show { display: block; }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .footer {
            text-align: center;
            color: rgba(255,255,255,0.7);
            margin-top: 20px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-box">
            <div class="register-header">
                <h1>员工注册</h1>
                <p>创建工作量统计账户</p>
            </div>
            
            <div class="error-msg" id="errorMsg"></div>
            <div class="success-msg" id="successMsg"></div>
            
            <form id="registerForm" onsubmit="return handleRegister(event)">
                <div class="form-section">
                    <div class="form-section-title">基本信息</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>员工编号 <span class="required">*</span></label>
                            <input type="text" id="employee_id" placeholder="工号" required>
                        </div>
                        <div class="form-group">
                            <label>姓名 <span class="required">*</span></label>
                            <input type="text" id="name" placeholder="姓名" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>电话</label>
                            <input type="tel" id="phone" placeholder="手机号码">
                        </div>
                        <div class="form-group">
                            <label>申报职称</label>
                            <select id="title">
                                <option value="">请选择职称</option>
                                <option value="副主任医师">副主任医师</option>
                                <option value="主任医师">主任医师</option>
                                <option value="麻醉医师">麻醉医师</option>
                                <option value="护士">护士</option>
                                
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-section-title">登录密码</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>密码 <span class="required">*</span></label>
                            <input type="password" id="password" placeholder="至少6位" required minlength="6">
                        </div>
                        <div class="form-group">
                            <label>确认密码 <span class="required">*</span></label>
                            <input type="password" id="confirmPassword" placeholder="再次输入密码" required>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="form-section-title">统计时间设置</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>统计开始时间</label>
                            <input type="date" id="start_date" value="2026-01-01">
                        </div>
                        <div class="form-group">
                            <label>统计结束时间</label>
                            <input type="date" id="end_date" value="2026-12-31">
                        </div>
                    </div>
                    <div class="form-hint">设置默认的统计时间范围，可在查询页面修改</div>
                </div>

                <button type="submit" class="btn btn-primary" id="btnRegister">注册</button>
            </form>
            
            <div class="loading" id="loading">
                <div class="spinner"></div>
            </div>
            
            <div class="links" style="display: flex; justify-content: space-between; align-items: center;">
                <a href="/login" class="btn-outline">← 返回登录</a>
                <a href="/login">已有账号？立即登录</a>
            </div>
        </div>
        
        <div class="footer">
            Powered by Python Flask
        </div>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        const show = el => el.classList.add('show');
        const hide = el => el.classList.remove('show');

        async function handleRegister(e) {
            e.preventDefault();
            
            const employee_id = $('employee_id').value.trim();
            const name = $('name').value.trim();
            const phone = $('phone').value.trim();
            const title = $('title').value;
            const password = $('password').value;
            const confirmPassword = $('confirmPassword').value;
            const start_date = $('start_date').value;
            const end_date = $('end_date').value;
            
            hide($('errorMsg'));
            hide($('successMsg'));
            
            if (!employee_id) {
                $('errorMsg').textContent = '请输入员工编号';
                show($('errorMsg'));
                return false;
            }
            
            if (!name) {
                $('errorMsg').textContent = '请输入姓名';
                show($('errorMsg'));
                return false;
            }
            
            if (!password || password.length < 6) {
                $('errorMsg').textContent = '密码至少6个字符';
                show($('errorMsg'));
                return false;
            }
            
            if (password !== confirmPassword) {
                $('errorMsg').textContent = '两次输入的密码不一致';
                show($('errorMsg'));
                return false;
            }
            
            if (start_date && end_date && start_date > end_date) {
                $('errorMsg').textContent = '开始时间不能晚于结束时间';
                show($('errorMsg'));
                return false;
            }
            
            $('btnRegister').disabled = true;
            $('registerForm').style.display = 'none';
            show($('loading'));
            
            try {
                const res = await fetch('/api/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        employee_id, username: name, phone, title,
                        password, start_date, end_date
                    })
                });
                const data = await res.json();
                
                if (data.success) {
                    $('successMsg').textContent = '注册成功！正在跳转登录页面...';
                    show($('successMsg'));
                    hide($('loading'));
                    setTimeout(() => window.location.href = '/login', 1500);
                } else {
                    $('errorMsg').textContent = data.message;
                    show($('errorMsg'));
                    $('btnRegister').disabled = false;
                    $('registerForm').style.display = 'block';
                    hide($('loading'));
                }
            } catch (err) {
                $('errorMsg').textContent = '注册失败，请稍后重试';
                show($('errorMsg'));
                $('btnRegister').disabled = false;
                $('registerForm').style.display = 'block';
                hide($('loading'));
            }
            
            return false;
        }
    </script>
</body>
</html>
