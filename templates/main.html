<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>东华住院工作量查询</title>
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --sidebar-bg: #2d3748;
            --sidebar-hover: #4a5568;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            min-height: 100vh;
        }
        .app-layout { display: flex; min-height: 100vh; }

        {% include 'partials/nav_sidebar_guest_styles.html' %}

        /* 主内容 */
        .main-content {
            flex: 1;
            margin-left: 220px;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }
        .welcome-box {
            text-align: center;
            background: white;
            padding: 50px 70px;
            border-radius: 16px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.25);
        }
        .welcome-box h1 {
            font-size: 2em;
            color: var(--primary);
            margin-bottom: 15px;
        }
        .welcome-box p {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 35px;
        }
        .btn-group { display: flex; gap: 20px; justify-content: center; }
        .btn {
            padding: 12px 40px;
            font-size: 1em;
            border-radius: 8px;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
        }
        .btn-outline {
            background: white;
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>
    <div class="app-layout">
        {% include 'partials/nav_sidebar_guest.html' %}

        <main class="main-content">
            <div class="welcome-box">
                <h1>东华住院工作量查询系统</h1>
                <p>欢迎使用工作量查询平台</p>
                <div class="btn-group">
                    <a href="/login" class="btn btn-primary">登录系统</a>
                    <a href="/register" class="btn btn-outline">注册账号</a>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
