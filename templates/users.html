<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 东华住院工作量查询</title>
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --info: #17a2b8;
            --secondary: #6c757d;
            --sidebar-bg: #2d3748;
            --sidebar-hover: #4a5568;
            --border: #ddd;
            --text: #333;
            --text-light: #666;
            --bg-light: #f8f9fa;
            --shadow: 0 10px 40px rgba(0,0,0,0.15);
            --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            min-height: 100vh;
            color: var(--text);
        }

        /* 整体布局 */
        .app-layout {
            display: flex;
            min-height: 100vh;
        }

        {% include 'partials/nav_sidebar_styles.html' %}

        /* 主内容区 */
        .main-content {
            flex: 1;
            margin-left: 240px;
            padding: 30px;
        }
        .page-header {
            color: white;
            margin-bottom: 30px;
            text-align: center;
        }
        .page-header h2 {
            font-size: 2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .page-header p {
            opacity: 0.9;
            margin-top: 5px;
        }

        /* 内容卡片 */
        .content-card {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 25px;
            margin-bottom: 20px;
        }

        /* 统计卡片 */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: white;
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .stat-card .stat-value {
            font-size: 2.5em;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-card .stat-label {
            color: var(--text-light);
            font-size: 0.95em;
            margin-top: 8px;
        }

        /* 按钮 */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        .btn-danger:hover {
            background: #c82333;
        }
        .btn-warning {
            background: var(--warning);
            color: #212529;
        }
        .btn-warning:hover {
            background: #e0a800;
        }
        .btn-info {
            background: var(--info);
            color: white;
        }
        .btn-info:hover {
            background: #138496;
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }
        
        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.show {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: var(--radius);
            padding: 30px;
            width: 500px;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }
        .modal-header h3 {
            margin: 0;
            color: var(--text);
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-light);
        }
        .modal-close:hover {
            color: var(--danger);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: var(--text);
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }

        /* 表格 */
        .table-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th {
            background: var(--bg-light);
            font-weight: 600;
            color: var(--text);
            font-size: 0.9em;
        }
        td {
            font-size: 0.9em;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover td {
            background: #fafafa;
        }

        /* 加载动画 */
        .loading {
            text-align: center;
            padding: 50px;
        }
        /* 查询进度条（时长不确定，持续来回滚动提示"正在查询"） */
        .progress-bar {
            width: 100%;
            max-width: 320px;
            height: 6px;
            margin: 0 auto;
            background: #eef0f5;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 40%;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            animation: progress-sweep 1.2s ease-in-out infinite;
        }
        @keyframes progress-sweep {
            0% { margin-left: -40%; }
            100% { margin-left: 100%; }
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-light);
        }

    </style>
</head>
<body>
    <div class="app-layout">
        <!-- 侧边栏 -->
        {% set active_page = 'users' %}
        {% include 'partials/nav_sidebar.html' %}

        <!-- 主内容 -->
        <main class="main-content">
            <div class="page-header">
                <h2>用户管理</h2>
                <p>管理系统用户信息</p>
            </div>
            
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-value" id="totalUsers">0</div>
                    <div class="stat-label">总用户数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="todayUsers">0</div>
                    <div class="stat-label">今日注册</div>
                </div>
            </div>
            
            <div class="content-card">
                <div style="margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
                    <button class="btn btn-primary" onclick="openAddModal()">
                        <span>+</span> 添加用户
                    </button>
                </div>
                
                <div class="loading" id="loading">
                    <div class="progress-bar"><div class="progress-bar-fill"></div></div>
                </div>
                <div id="tableContent" style="display:none;">
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>员工编号</th>
                                    <th>姓名</th>
                                    <th>电话</th>
                                    <th>申报职称</th>
                                    <th>统计期间</th>
                                    <th>钉钉ID</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="userTableBody"></tbody>
                        </table>
                    </div>
                </div>
                <div class="empty-state" id="emptyState" style="display:none;">
                    <p>暂无用户数据</p>
                </div>
            </div>
            
            <!-- 住院查询结果区域 -->
            <div class="content-card" id="inpatientResultCard" style="display:none;">
                <h3 style="margin-bottom:15px;">住院查询结果 - <span id="inpatientQueryUser"></span></h3>
                <div id="inpatientLoading" style="display:none; text-align:center; padding:30px;">
                    <div class="progress-bar"><div class="progress-bar-fill"></div></div>
                    <p style="margin-top:10px;">查询中...</p>
                </div>
                <div id="inpatientResult"></div>
            </div>
            
            <!-- 门诊查询结果区域 -->
            <div class="content-card" id="clinicResultCard" style="display:none;">
                <h3 style="margin-bottom:15px;">门诊查询结果 - <span id="clinicQueryUser"></span></h3>
                <div id="clinicLoading" style="display:none; text-align:center; padding:30px;">
                    <div class="progress-bar"><div class="progress-bar-fill"></div></div>
                    <p style="margin-top:10px;">查询中...</p>
                </div>
                <div id="clinicResult"></div>
            </div>
            
            <!-- 患者查询结果区域 -->
            <div class="content-card" id="patientResultCard" style="display:none;">
                <h3 style="margin-bottom:15px;">患者查询结果 - <span id="patientQueryUser"></span></h3>
                <div id="patientLoading" style="display:none; text-align:center; padding:30px;">
                    <div class="progress-bar"><div class="progress-bar-fill"></div></div>
                    <p style="margin-top:10px;">查询中...</p>
                </div>
                <div id="patientResult"></div>
            </div>
        </main>
    </div>

    <!-- 编辑用户弹窗 -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">编辑用户</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="userForm">
                <input type="hidden" id="userId">
                <div class="form-row">
                    <div class="form-group">
                        <label>员工编号 *</label>
                        <input type="text" id="employeeId" required>
                    </div>
                    <div class="form-group">
                        <label>姓名 *</label>
                        <input type="text" id="username" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="password" placeholder="留空则不修改">
                    </div>
                    <div class="form-group">
                        <label>电话</label>
                        <input type="text" id="phone">
                    </div>
                </div>
                <div class="form-group">
                    <label>申报职称</label>
                    <select id="title">
                        <option value="">请选择</option>
                        <option value="主任医师">主任医师</option>
                        <option value="副主任医师">副主任医师</option>
                        <option value="护士">护士</option>
                        <option value="麻醉医师">麻醉医师</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>统计开始日期</label>
                        <input type="date" id="startDate">
                    </div>
                    <div class="form-group">
                        <label>统计结束日期</label>
                        <input type="date" id="endDate">
                    </div>
                </div>
                <div class="form-group">
                    <label>钉钉用户ID</label>
                    <input type="text" id="dingtalkUserid" placeholder="用于接收钉钉消息">
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">保存</button>
                    <button type="button" class="btn" onclick="closeModal()" style="background:#6c757d;color:white;">取消</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 添加用户弹窗 -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>添加用户</h3>
                <button class="modal-close" onclick="closeAddModal()">&times;</button>
            </div>
            <form id="addUserForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>员工编号 *</label>
                        <input type="text" id="addEmployeeId" required>
                    </div>
                    <div class="form-group">
                        <label>姓名 *</label>
                        <input type="text" id="addUsername" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>密码 *</label>
                        <input type="password" id="addPassword" required minlength="6" placeholder="至少6个字符">
                    </div>
                    <div class="form-group">
                        <label>电话</label>
                        <input type="text" id="addPhone">
                    </div>
                </div>
                <div class="form-group">
                    <label>申报职称</label>
                    <select id="addTitle">
                        <option value="">请选择</option>
                        <option value="主任医师">主任医师</option>
                        <option value="副主任医师">副主任医师</option>
                        <option value="护士">护士</option>
                        <option value="麻醉医师">麻醉医师</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>统计开始日期</label>
                        <input type="date" id="addStartDate" value="2026-01-01">
                    </div>
                    <div class="form-group">
                        <label>统计结束日期</label>
                        <input type="date" id="addEndDate" value="2026-12-31">
                    </div>
                </div>
                <div class="form-group">
                    <label>钉钉用户ID</label>
                    <input type="text" id="addDingtalkUserid" placeholder="用于接收钉钉消息">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn" onclick="closeAddModal()" style="background:#6c757d;color:white;">取消</button>
                    <button type="submit" class="btn btn-primary">添加</button>
                </div>
            </form>
        </div>
    </div>



    <script>
        const $ = id => document.getElementById(id);
        
        // 检查登录状态
        async function checkLogin() {
            try {
                const res = await fetch('/api/session');
                const data = await res.json();
                if (!data.logged_in) {
                    window.location.href = '/login';
                    return false;
                }
                $('currentUser').textContent = data.user.username;
                return true;
            } catch (err) {
                window.location.href = '/login';
                return false;
            }
        }
        
        // 共用侧边栏导航点击入口（见 partials/nav_sidebar.html）
        // 本页面为独立整页，除"用户管理"自身外，其余菜单项跳转回主页对应 Tab
        function navGo(page) {
            if (page === 'users') return;
            location.href = '/main?page=' + page;
        }

        // 退出登录
        async function logout() {
            if (!confirm('确定要退出登录吗？')) return;
            await fetch('/api/session', { method: 'DELETE' });
            window.location.href = '/login';
        }
        
        // 加载用户列表
        async function loadUsers() {
            $('loading').style.display = 'block';
            $('tableContent').style.display = 'none';
            $('emptyState').style.display = 'none';
            
            try {
                const res = await fetch('/api/users');
                const data = await res.json();
                
                $('loading').style.display = 'none';
                
                if (!data.success) {
                    if (data.require_login) {
                        window.location.href = '/login';
                    }
                    return;
                }
                
                const users = data.users || [];
                $('totalUsers').textContent = users.length;
                
                // 计算今日注册
                const today = new Date().toDateString();
                const todayCount = users.filter(u => new Date(u.created_at).toDateString() === today).length;
                $('todayUsers').textContent = todayCount;
                
                if (users.length === 0) {
                    $('emptyState').style.display = 'block';
                    return;
                }
                
                $('tableContent').style.display = 'block';
                const tbody = $('userTableBody');
                tbody.innerHTML = users.map(user => `
                    <tr>
                        <td>${user.id}</td>
                        <td>${user.employee_id || '-'}</td>
                        <td>${user.username}</td>
                        <td>${user.phone || '-'}</td>
                        <td>${user.title || '-'}</td>
                        <td>${user.start_date || '-'} 至 ${user.end_date || '-'}</td>
                        <td>${user.dingtalk_userid || '-'}</td>
                        <td>
                            <button class="btn btn-primary btn-sm" onclick="queryInpatient('${user.employee_id}', '${user.username}', '${user.start_date || ''}', '${user.end_date || ''}', '${user.title || ''}')">住院查询</button>
                            <button class="btn btn-sm" onclick="queryPatients('${user.employee_id}', '${user.username}', '${user.start_date || ''}', '${user.end_date || ''}', '${user.title || ''}')" style="background:#20c997;color:white;">患者查询</button>
                            <button class="btn btn-info btn-sm" onclick="queryClinic('${user.employee_id}', '${user.username}')">门诊查询</button>
                            <button class="btn btn-warning btn-sm" onclick="editUser(${user.id})">编辑</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteUser(${user.id}, '${user.username}')">删除</button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('加载用户失败:', err);
                $('loading').style.display = 'none';
            }
        }
        
        // 打开添加用户弹窗
        function openAddModal() {
            $('addEmployeeId').value = '';
            $('addUsername').value = '';
            $('addPassword').value = '';
            $('addPassword').required = true;
            $('addPhone').value = '';
            $('addTitle').value = '';
            $('addStartDate').value = '2026-01-01';
            $('addEndDate').value = '2026-12-31';
            $('addDingtalkUserid').value = '';
            $('addModal').classList.add('show');
        }
        
        function closeAddModal() {
            $('addModal').classList.remove('show');
        }
        
        // 提交添加用户表单
        document.getElementById('addUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                employee_id: $('addEmployeeId').value.trim(),
                username: $('addUsername').value.trim(),
                password: $('addPassword').value,
                phone: $('addPhone').value.trim(),
                title: $('addTitle').value,
                start_date: $('addStartDate').value,
                end_date: $('addEndDate').value
            };
            
            try {
                const res = await fetch('/api/users', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                
                if (result.success) {
                    // 如果填写了钉钉ID，更新
                    const dingtalkId = $('addDingtalkUserid').value.trim();
                    if (dingtalkId && result.user_id) {
                        await fetch(`/api/users/${result.user_id}/dingtalk`, {
                            method: 'PUT',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({dingtalk_userid: dingtalkId})
                        });
                    }
                    alert('添加成功');
                    closeAddModal();
                    loadUsers();
                } else {
                    alert('添加失败: ' + result.message);
                }
            } catch (err) {
                alert('添加失败，请稍后重试');
            }
        });
        
        // 打开编辑用户弹窗
        async function editUser(userId) {
            try {
                const res = await fetch('/api/users');
                const data = await res.json();
                const user = data.users.find(u => u.id === userId);
                
                if (user) {
                    $('userId').value = user.id;
                    $('employeeId').value = user.employee_id || '';
                    $('username').value = user.username;
                    $('password').value = '';
                    $('password').required = false;
                    $('phone').value = user.phone || '';
                    $('title').value = user.title || '';
                    $('startDate').value = user.start_date || '';
                    $('endDate').value = user.end_date || '';
                    $('dingtalkUserid').value = user.dingtalk_userid || '';
                    $('modalTitle').textContent = '编辑用户: ' + user.username;
                    $('editModal').classList.add('show');
                }
            } catch (err) {
                alert('加载用户信息失败');
            }
        }
        
        function closeModal() {
            $('editModal').classList.remove('show');
        }
        
        // 提交编辑用户表单
        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userId = $('userId').value;
            const data = {
                employee_id: $('employeeId').value.trim(),
                username: $('username').value.trim(),
                phone: $('phone').value.trim(),
                title: $('title').value,
                start_date: $('startDate').value,
                end_date: $('endDate').value
            };
            
            // 如果填写了新密码
            const newPassword = $('password').value;
            if (newPassword) {
                data.password = newPassword;
            }
            
            try {
                const res = await fetch(`/api/users/${userId}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                
                if (result.success) {
                    // 更新钉钉ID
                    const dingtalkId = $('dingtalkUserid').value.trim();
                    await fetch(`/api/users/${userId}/dingtalk`, {
                        method: 'PUT',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({dingtalk_userid: dingtalkId})
                    });
                    alert('保存成功');
                    closeModal();
                    loadUsers();
                } else {
                    alert('保存失败: ' + result.message);
                }
            } catch (err) {
                alert('保存失败，请稍后重试');
            }
        });
        
        // 删除用户
        async function deleteUser(id, name) {
            if (!confirm(`确定删除用户 "${name}" 吗？此操作不可恢复！`)) return;

            try {
                const res = await fetch(`/api/users/${id}`, { method: 'DELETE' });
                const data = await res.json();

                if (data.success) {
                    alert('删除成功');
                    loadUsers();
                } else {
                    alert('删除失败: ' + data.message);
                }
            } catch (err) {
                alert('删除失败，请稍后重试');
            }
        }

        // 职称到查询类型的映射
        function getQueryType(title) {
            const map = {
                '主任医师': 'sp',
                '副主任医师': 'ap',
                '护士': 'nurse',
                '麻醉医师': 'anes'
            };
            return map[title] || 'sp';
        }

        // 住院查询 - 直接查询
        async function queryInpatient(employeeId, username, startDate, endDate, title) {
            if (!employeeId) {
                alert('该用户没有员工编号，无法查询');
                return;
            }

            const queryType = getQueryType(title);

            // 默认使用本年
            const now = new Date();
            const queryStart = startDate || now.getFullYear() + '-01-01';
            const queryEnd = endDate || now.getFullYear() + '-12-31';

            $('inpatientQueryUser').textContent = username || employeeId;
            $('inpatientResultCard').style.display = 'block';
            $('inpatientLoading').style.display = 'block';
            $('inpatientResult').innerHTML = '';

            try {
                const formData = new FormData();
                formData.append('employee_id', employeeId);  // 员工编号
                formData.append('name', username || employeeId);  // 姓名
                formData.append('query_type', queryType);
                formData.append('start_date', queryStart);
                formData.append('end_date', queryEnd);

                const res = await fetch('/api/reports/inpatient-workload', { method: 'POST', body: formData });
                const data = await res.json();

                if (data.success) {
                    if (data.rows && data.rows.length > 0) {
                        const cols = data.columns;
                        const rows = data.rows;
                        let html = `<p style="color:#28a745; font-weight:bold; margin-bottom:10px;">查询成功，共 ${rows.length} 条记录（${queryStart} 至 ${queryEnd}）</p>`;
                        html += `<div style="max-height:400px; overflow:auto;">
                            <table style="width:100%; border-collapse:collapse;">
                                <thead style="background:#f8f9fa;">
                                    <tr>`;
                        for (let i = 0; i < cols.length; i++) {
                            html += `<th style="padding:10px; border:1px solid #ddd; text-align:left;">${cols[i]}</th>`;
                        }
                        html += `</tr></thead><tbody>`;
                        rows.forEach((row) => {
                            html += '<tr>';
                            for (let i = 0; i < row.length; i++) {
                                html += `<td style="padding:8px; border:1px solid #ddd;">${row[i] ?? ''}</td>`;
                            }
                            html += '</tr>';
                        });
                        html += '</tbody></table></div>';
                        $('inpatientResult').innerHTML = html;
                    } else {
                        $('inpatientResult').innerHTML = '<p style="color:#666;">未查询到数据</p>';
                    }
                } else {
                    $('inpatientResult').innerHTML = `<p style="color:#dc3545;">查询失败: ${data.message || '未知错误'}</p>`;
                }
            } catch (err) {
                console.error('查询失败:', err);
                $('inpatientResult').innerHTML = '<p style="color:#dc3545;">查询失败，请稍后重试</p>';
            } finally {
                $('inpatientLoading').style.display = 'none';
            }
        }

        // 门诊查询
        async function queryClinic(employeeId, username) {
            if (!username) {
                alert('该用户没有姓名，无法查询');
                return;
            }

            $('clinicQueryUser').textContent = username;
            $('clinicResultCard').style.display = 'block';
            $('clinicLoading').style.display = 'block';
            $('clinicResult').innerHTML = '';

            try {
                const formData = new FormData();
                formData.append('doctor_name', username);
                formData.append('employee_id', employeeId || '');

                const res = await fetch('/api/reports/outpatient-workload', { method: 'POST', body: formData });
                const data = await res.json();

                if (data.success) {
                    if (data.data && data.data.length > 0) {
                        let html = `<p style="color:#28a745; font-weight:bold; margin-bottom:10px;">查询成功，共 ${data.total} 条记录</p>`;
                        html += `<div style="max-height:400px; overflow:auto;">
                            <table style="width:100%; border-collapse:collapse;">
                                <thead style="background:#f8f9fa;">
                                    <tr><th>期间</th><th>医师姓名</th><th>门诊人次</th></tr>
                                </thead><tbody>`;
                        data.data.forEach(row => {
                            html += `<tr><td>${row['期间'] || '-'}</td><td>${row['医师姓名'] || '-'}</td><td>${row['门诊人次'] || 0}</td></tr>`;
                        });
                        html += '</tbody></table></div>';
                        $('clinicResult').innerHTML = html;
                    } else {
                        $('clinicResult').innerHTML = '<p style="color:#666;">未查询到数据</p>';
                    }
                } else {
                    $('clinicResult').innerHTML = `<p style="color:#dc3545;">查询失败: ${data.message || '未知错误'}</p>`;
                }
            } catch (err) {
                console.error('门诊查询失败:', err);
                $('clinicResult').innerHTML = '<p style="color:#dc3545;">查询失败，请稍后重试</p>';
            } finally {
                $('clinicLoading').style.display = 'none';
            }
        }

        // 患者查询 - 按医生或护士姓名查询其名下患者列表
        async function queryPatients(employeeId, username, startDate, endDate, title) {
            if (!username) {
                alert('该用户没有姓名，无法查询');
                return;
            }

            $('patientQueryUser').textContent = username;
            $('patientResultCard').style.display = 'block';
            $('patientLoading').style.display = 'block';
            $('patientResult').innerHTML = '';

            // 滚动到结果区域
            $('patientResultCard').scrollIntoView({ behavior: 'smooth' });

            // 根据职称决定调用哪个API和查询类型（去除首尾空格后比较）
            const isNurse = title && title.trim() === '护士';
            const queryType = isNurse ? 'nurse' : '';

            // 默认使用本年
            const now = new Date();
            const queryStart = startDate || now.getFullYear() + '-01-01';
            const queryEnd = endDate || now.getFullYear() + '-12-31';

            try {
                const formData = new FormData();
                formData.append('name', username);
                formData.append('start_date', queryStart);
                formData.append('end_date', queryEnd);

                // 根据职称选择API：护士调用护士患者查询API，其他调用医生患者查询API
                const apiUrl = isNurse ? '/api/reports/patients/by-nurse' : '/api/reports/patients/by-doctor';
                if (isNurse) {
                    formData.append('query_type', queryType);
                }

                const res = await fetch(apiUrl, { method: 'POST', body: formData });
                const data = await res.json();

                if (data.success) {
                    if (data.rows && data.rows.length > 0) {
                        const cols = data.columns;
                        const rows = data.rows;
                        let html = `<p style="color:#28a745; font-weight:bold; margin-bottom:10px;">查询成功，共 ${data.row_count} 条记录（${queryStart} 至 ${queryEnd}）</p>`;
                        html += `<div style="max-height:500px; overflow:auto;">
                            <table style="width:100%; border-collapse:collapse;">
                                <thead style="background:#f8f9fa;"><tr>`;
                        cols.forEach(col => {
                            html += `<th style="padding:10px; border:1px solid #ddd; text-align:left; white-space:nowrap;">${col}</th>`;
                        });
                        html += `</tr></thead><tbody>`;
                        rows.forEach(row => {
                            html += '<tr>';
                            row.forEach(cell => {
                                html += `<td style="padding:8px; border:1px solid #ddd;">${cell}</td>`;
                            });
                            html += '</tr>';
                        });
                        html += '</tbody></table></div>';
                        if (data.output_file) {
                            html += `<p style="margin-top:15px;">
                                <a href="javascript:void(0)" onclick="openPatientOutputDir()">点击打开输出目录查看文件</a>
                                ${data.pdf_path ? ` | <a href="javascript:void(0)" onclick="openPatientPDF('${data.pdf_path.replace(/\\/g, '\\\\').replace(/'/g, "\\'")}')">查看PDF</a>` : ''}
                            </p>`;
                        }
                        $('patientResult').innerHTML = html;
                    } else {
                        $('patientResult').innerHTML = `<p style="color:#666;">未查询到患者数据</p>`;
                    }
                } else {
                    $('patientResult').innerHTML = `<p style="color:#dc3545;">查询失败: ${data.message || '未知错误'}</p>`;
                }
            } catch (err) {
                console.error('患者查询失败:', err);
                $('patientResult').innerHTML = '<p style="color:#dc3545;">查询失败，请稍后重试</p>';
            } finally {
                $('patientLoading').style.display = 'none';
            }
        }

        // 打开患者查询结果所在的输出目录
        async function openPatientOutputDir() {
            try { await fetch('/api/system/output-dir/open', { method: 'POST' }); } catch (err) { alert('无法打开目录'); }
        }

        // 打开患者查询结果的PDF文件
        async function openPatientPDF(pdfPath) {
            if (!pdfPath) return alert('文件路径不存在');
            try {
                const formData = new FormData();
                formData.append('path', pdfPath);
                await fetch('/api/system/pdf/open', { method: 'POST', body: formData });
            } catch (err) { alert('无法打开PDF'); }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', async () => {
            if (!await checkLogin()) return;
            loadUsers();
        });
    </script>
</body>
</html>
