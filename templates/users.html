<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 东华住院工作量查询</title>
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #764ba2;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --info: #17a2b8;
            --secondary: #6c757d;
            --sidebar-bg: #2d3748;
            --sidebar-hover: #4a5568;
            --border: #ddd;
            --text: #333;
            --text-light: #666;
            --bg-light: #f8f9fa;
            --shadow: 0 10px 40px rgba(0,0,0,0.15);
            --radius: 12px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", Arial, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            min-height: 100vh;
            color: var(--text);
        }

        /* 整体布局 */
        .app-layout {
            display: flex;
            min-height: 100vh;
        }

        {% include 'partials/nav_sidebar_styles.html' %}

        /* 主内容区 */
        .main-content {
            flex: 1;
            margin-left: 240px;
            padding: 30px;
        }
        .page-header {
            color: white;
            margin-bottom: 30px;
            text-align: center;
        }
        .page-header h2 {
            font-size: 2em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }
        .page-header p {
            opacity: 0.9;
            margin-top: 5px;
        }

        /* 内容卡片 */
        .content-card {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 25px;
            margin-bottom: 20px;
        }

        /* 统计卡片 */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }
        .stat-card {
            background: white;
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: var(--shadow);
            text-align: center;
        }
        .stat-card .stat-value {
            font-size: 2.5em;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .stat-card .stat-label {
            color: var(--text-light);
            font-size: 0.95em;
            margin-top: 8px;
        }

        /* 按钮 */
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        .btn-danger:hover {
            background: #c82333;
        }
        .btn-warning {
            background: var(--warning);
            color: #212529;
        }
        .btn-warning:hover {
            background: #e0a800;
        }
        .btn-info {
            background: var(--info);
            color: white;
        }
        .btn-info:hover {
            background: #138496;
        }
        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }
        
        /* 弹窗样式 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.show {
            display: flex;
        }
        .modal-content {
            background: white;
            border-radius: var(--radius);
            padding: 30px;
            width: 500px;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border);
        }
        .modal-header h3 {
            margin: 0;
            color: var(--text);
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-light);
        }
        .modal-close:hover {
            color: var(--danger);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: var(--text);
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: var(--primary);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
        }

        /* 表格 */
        .table-container {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        th {
            background: var(--bg-light);
            font-weight: 600;
            color: var(--text);
            font-size: 0.9em;
        }
        td {
            font-size: 0.9em;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover td {
            background: #fafafa;
        }

        /* 创建日期查询条件 */
        .user-filter-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .user-filter-row input[type="date"] {
            padding: 6px 8px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
        }
        .user-filter-row input[type="date"]:focus {
            outline: none;
            border-color: var(--primary);
        }
        .user-filter-summary {
            color: var(--text-light);
            font-size: 13px;
        }

        /* 用户列表整表展开显示：各列内容不折行，空间不足时横向滚动 */
        .users-table {
            min-width: 1340px;
        }
        .users-table th,
        .users-table td {
            white-space: nowrap;
            padding: 12px 10px;
        }
        .users-table .btn-sm {
            padding: 5px 9px;
        }

        /* 查询结果框（与工作量查询页面保持一致） */
        .result-box {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            line-height: 1.6;
        }
        .result-box.show { display: block; }
        .result-box.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .result-box.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .result-message { white-space: pre-line; }
        .btn-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        /* 查询结果表格（与工作量查询页面保持一致） */
        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        .history-table th,
        .history-table td {
            padding: 10px 8px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }
        .history-table th {
            background: var(--bg-light);
            font-weight: 600;
        }
        .history-table tbody tr:hover { background: #fafafa; }

        /* 加载动画 */
        .loading {
            text-align: center;
            padding: 50px;
        }
        /* 查询进度条（时长不确定，持续来回滚动提示"正在查询"） */
        .progress-bar {
            width: 100%;
            max-width: 320px;
            height: 6px;
            margin: 0 auto;
            background: #eef0f5;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%;
            width: 40%;
            border-radius: 3px;
            background: linear-gradient(90deg, var(--primary), var(--primary-dark));
            animation: progress-sweep 1.2s ease-in-out infinite;
        }
        @keyframes progress-sweep {
            0% { margin-left: -40%; }
            100% { margin-left: 100%; }
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-light);
        }

    </style>
</head>
<body>
    <div class="app-layout">
        <!-- 侧边栏 -->
        {% set active_page = 'users' %}
        {% include 'partials/nav_sidebar.html' %}

        <!-- 主内容 -->
        <main class="main-content">
            <div class="page-header">
                <h2>用户管理</h2>
                <p>管理系统用户信息</p>
            </div>
            
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-value" id="totalUsers">0</div>
                    <div class="stat-label">总用户数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="todayUsers">0</div>
                    <div class="stat-label">今日注册</div>
                </div>
            </div>
            
            <div class="content-card">
                <div style="margin-bottom: 15px; display: flex; gap: 10px; flex-wrap: wrap;">
                    <button class="btn btn-primary" onclick="openAddModal()">
                        <span>+</span> 添加用户
                    </button>
                </div>

                <div class="user-filter-row">
                    <label for="userCreatedStartDate">创建日期：</label>
                    <input type="date" id="userCreatedStartDate">
                    <span>至</span>
                    <input type="date" id="userCreatedEndDate">
                    <button class="btn btn-primary btn-sm" onclick="filterUsersByCreatedAt()">查询</button>
                    <button class="btn btn-sm" onclick="resetUserFilter()" style="background:#6c757d;color:white;">重置</button>
                    <span class="user-filter-summary" id="userFilterSummary"></span>
                </div>
                
                <div class="loading" id="loading">
                    <div class="progress-bar"><div class="progress-bar-fill"></div></div>
                </div>
                <div id="tableContent" style="display:none;">
                    <div class="table-container">
                        <table class="users-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>员工编号</th>
                                    <th>姓名</th>
                                    <th>电话</th>
                                    <th>申报职称</th>
                                    <th>统计期间</th>
                                    <th>钉钉ID</th>
                                    <th>创建日期</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody id="userTableBody"></tbody>
                        </table>
                    </div>
                </div>
                <div class="empty-state" id="emptyState" style="display:none;">
                    <p id="emptyStateText">暂无用户数据</p>
                </div>
            </div>
            
            <!-- 住院查询结果区域 -->
            <div class="content-card" id="inpatientResultCard" style="display:none;">
                <h3 style="margin-bottom:15px;">住院查询结果 - <span id="inpatientQueryUser"></span></h3>
                <div id="inpatientLoading" style="display:none; text-align:center; padding:30px;">
                    <div class="progress-bar"><div class="progress-bar-fill"></div></div>
                    <p style="margin-top:10px;">查询中...</p>
                </div>
                <div id="inpatientResult"></div>
            </div>
            
            <!-- 门诊查询结果区域 -->
            <div class="content-card" id="clinicResultCard" style="display:none;">
                <h3 style="margin-bottom:15px;">门诊查询结果 - <span id="clinicQueryUser"></span></h3>
                <div id="clinicLoading" style="display:none; text-align:center; padding:30px;">
                    <div class="progress-bar"><div class="progress-bar-fill"></div></div>
                    <p style="margin-top:10px;">查询中...</p>
                </div>
                <div id="clinicResult"></div>
            </div>
            
            <!-- 患者查询结果区域 -->
            <div class="content-card" id="patientResultCard" style="display:none;">
                <h3 style="margin-bottom:15px;">患者查询结果 - <span id="patientQueryUser"></span></h3>
                <div id="patientLoading" style="display:none; text-align:center; padding:30px;">
                    <div class="progress-bar"><div class="progress-bar-fill"></div></div>
                    <p style="margin-top:10px;">查询中...</p>
                </div>
                <div id="patientResult"></div>
            </div>
        </main>
    </div>

    <!-- 编辑用户弹窗 -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">编辑用户</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="userForm">
                <input type="hidden" id="userId">
                <div class="form-row">
                    <div class="form-group">
                        <label>员工编号 *</label>
                        <input type="text" id="employeeId" required>
                    </div>
                    <div class="form-group">
                        <label>姓名 *</label>
                        <input type="text" id="username" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>密码</label>
                        <input type="password" id="password" placeholder="留空则不修改">
                    </div>
                    <div class="form-group">
                        <label>电话</label>
                        <input type="text" id="phone">
                    </div>
                </div>
                <div class="form-group">
                    <label>申报职称</label>
                    <select id="title">
                        <option value="">请选择</option>
                        <option value="主任医师">主任医师</option>
                        <option value="副主任医师">副主任医师</option>
                        <option value="护士">护士</option>
                        <option value="麻醉医师">麻醉医师</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>统计开始日期</label>
                        <input type="date" id="startDate">
                    </div>
                    <div class="form-group">
                        <label>统计结束日期</label>
                        <input type="date" id="endDate">
                    </div>
                </div>
                <div class="form-group">
                    <label>钉钉用户ID</label>
                    <input type="text" id="dingtalkUserid" placeholder="用于接收钉钉消息">
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">保存</button>
                    <button type="button" class="btn" onclick="closeModal()" style="background:#6c757d;color:white;">取消</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 添加用户弹窗 -->
    <div class="modal" id="addModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>添加用户</h3>
                <button class="modal-close" onclick="closeAddModal()">&times;</button>
            </div>
            <form id="addUserForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>员工编号 *</label>
                        <input type="text" id="addEmployeeId" required>
                    </div>
                    <div class="form-group">
                        <label>姓名 *</label>
                        <input type="text" id="addUsername" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>密码 *</label>
                        <input type="password" id="addPassword" required minlength="6" placeholder="至少6个字符">
                    </div>
                    <div class="form-group">
                        <label>电话</label>
                        <input type="text" id="addPhone">
                    </div>
                </div>
                <div class="form-group">
                    <label>申报职称</label>
                    <select id="addTitle">
                        <option value="">请选择</option>
                        <option value="主任医师">主任医师</option>
                        <option value="副主任医师">副主任医师</option>
                        <option value="护士">护士</option>
                        <option value="麻醉医师">麻醉医师</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>统计开始日期</label>
                        <input type="date" id="addStartDate" value="2026-01-01">
                    </div>
                    <div class="form-group">
                        <label>统计结束日期</label>
                        <input type="date" id="addEndDate" value="2026-12-31">
                    </div>
                </div>
                <div class="form-group">
                    <label>钉钉用户ID</label>
                    <input type="text" id="addDingtalkUserid" placeholder="用于接收钉钉消息">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn" onclick="closeAddModal()" style="background:#6c757d;color:white;">取消</button>
                    <button type="submit" class="btn btn-primary">添加</button>
                </div>
            </form>
        </div>
    </div>



    <script>
        const $ = id => document.getElementById(id);

        function formatDateRange(startDate, endDate) {
            const cleanDate = value => {
                const values = String(value || '')
                    .split(/[\r\n]+/)
                    .map(item => item.trim())
                    .filter(Boolean);
                return [...new Set(values)].join(' / ') || '-';
            };
            return `${cleanDate(startDate)} 至 ${cleanDate(endDate)}`;
        }
        
        // 检查登录状态
        async function checkLogin() {
            try {
                const res = await fetch('/api/session');
                const data = await res.json();
                if (!data.logged_in) {
                    window.location.href = '/login';
                    return false;
                }
                $('currentUser').textContent = data.user.username;
                return true;
            } catch (err) {
                window.location.href = '/login';
                return false;
            }
        }
        
        // 共用侧边栏导航点击入口（见 partials/nav_sidebar.html）
        // 本页面为独立整页，除"用户管理"自身外，其余菜单项跳转回主页对应 Tab
        function navGo(page) {
            if (page === 'users') return;
            location.href = '/main?page=' + page;
        }

        // 退出登录
        async function logout() {
            if (!confirm('确定要退出登录吗？')) return;
            await fetch('/api/session', { method: 'DELETE' });
            window.location.href = '/login';
        }
        
        // 用户列表缓存（完整列表，按创建日期倒序）
        let allUsers = [];

        // 创建日期显示格式：yyyy-mm-dd HH:mm
        function formatCreatedAt(value) {
            const text = String(value ?? '').trim().replace('T', ' ');
            if (!text) return '-';
            return text.split('.')[0].slice(0, 16);
        }

        // 取 created_at 的日期部分，用于按创建日期查询
        function getCreatedDate(user) {
            return String(user.created_at || '').trim().split(' ')[0].replace(/\//g, '-');
        }

        // 按创建日期字段 created_at 倒序排列（同一时间按 id 倒序）
        function sortUsersByCreatedAt(users) {
            return users.slice().sort((left, right) => {
                const leftCreated = String(left.created_at || '');
                const rightCreated = String(right.created_at || '');
                if (leftCreated !== rightCreated) return leftCreated < rightCreated ? 1 : -1;
                return (Number(right.id) || 0) - (Number(left.id) || 0);
            });
        }

        // 渲染用户表格（全面展开显示全部列）
        function renderUserTable(users) {
            $('loading').style.display = 'none';

            if (!users.length) {
                $('tableContent').style.display = 'none';
                $('emptyState').style.display = 'block';
                $('emptyStateText').textContent = allUsers.length
                    ? '当前创建日期条件下没有用户'
                    : '暂无用户数据';
                return;
            }

            $('emptyState').style.display = 'none';
            $('tableContent').style.display = 'block';
            $('userTableBody').innerHTML = users.map(user => `
                <tr>
                    <td>${user.id}</td>
                    <td>${user.employee_id || '-'}</td>
                    <td>${user.username}</td>
                    <td>${user.phone || '-'}</td>
                    <td>${user.title || '-'}</td>
                    <td>${formatDateRange(user.start_date, user.end_date)}</td>
                    <td>${user.dingtalk_userid || '-'}</td>
                    <td class="user-created-at">${formatCreatedAt(user.created_at)}</td>
                    <td class="user-actions">
                        <button class="btn btn-primary btn-sm" onclick="queryInpatient(${user.id})">住院查询</button>
                        <button class="btn btn-sm" onclick="queryPatients('${user.employee_id}', '${user.username}', '${user.start_date || ''}', '${user.end_date || ''}', '${user.title || ''}')" style="background:#20c997;color:white;">患者查询</button>
                        <button class="btn btn-info btn-sm" onclick="queryClinic(${user.id})">门诊查询</button>
                        <button class="btn btn-warning btn-sm" onclick="editUser(${user.id})">编辑</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteUser(${user.id}, '${user.username}')">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        // 按创建日期查询条件过滤并刷新用户列表
        function applyUserFilter() {
            const startDate = $('userCreatedStartDate').value;
            const endDate = $('userCreatedEndDate').value;

            const filtered = allUsers.filter(user => {
                const createdDate = getCreatedDate(user);
                if (!createdDate) return false;
                if (startDate && createdDate < startDate) return false;
                if (endDate && createdDate > endDate) return false;
                return true;
            });

            $('userFilterSummary').textContent = (startDate || endDate)
                ? `创建日期 ${startDate || '不限'} 至 ${endDate || '不限'}，共 ${filtered.length} 人`
                : `共 ${filtered.length} 人（按创建日期倒序）`;

            renderUserTable(filtered);
        }

        function filterUsersByCreatedAt() {
            const startDate = $('userCreatedStartDate').value;
            const endDate = $('userCreatedEndDate').value;
            if (startDate && endDate && startDate > endDate) {
                return alert('开始日期不能晚于结束日期');
            }
            applyUserFilter();
        }

        function resetUserFilter() {
            $('userCreatedStartDate').value = '';
            $('userCreatedEndDate').value = '';
            applyUserFilter();
        }

        // 加载用户列表（按创建日期 created_at 倒序，全面展开显示）
        async function loadUsers() {
            $('loading').style.display = 'block';
            $('tableContent').style.display = 'none';
            $('emptyState').style.display = 'none';
            
            try {
                const res = await fetch('/api/users');
                const data = await res.json();
                
                if (!data.success) {
                    $('loading').style.display = 'none';
                    if (data.require_login) {
                        window.location.href = '/login';
                    }
                    return;
                }
                
                allUsers = sortUsersByCreatedAt(data.users || []);
                $('totalUsers').textContent = allUsers.length;
                
                // 计算今日注册
                const today = new Date().toDateString();
                const todayCount = allUsers.filter(u => new Date(u.created_at).toDateString() === today).length;
                $('todayUsers').textContent = todayCount;
                
                applyUserFilter();
            } catch (err) {
                console.error('加载用户失败:', err);
                $('loading').style.display = 'none';
            }
        }
        
        // 打开添加用户弹窗
        function openAddModal() {
            $('addEmployeeId').value = '';
            $('addUsername').value = '';
            $('addPassword').value = '';
            $('addPassword').required = true;
            $('addPhone').value = '';
            $('addTitle').value = '';
            $('addStartDate').value = '2026-01-01';
            $('addEndDate').value = '2026-12-31';
            $('addDingtalkUserid').value = '';
            $('addModal').classList.add('show');
        }
        
        function closeAddModal() {
            $('addModal').classList.remove('show');
        }
        
        // 提交添加用户表单
        document.getElementById('addUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                employee_id: $('addEmployeeId').value.trim(),
                username: $('addUsername').value.trim(),
                password: $('addPassword').value,
                phone: $('addPhone').value.trim(),
                title: $('addTitle').value,
                start_date: $('addStartDate').value,
                end_date: $('addEndDate').value
            };
            
            try {
                const res = await fetch('/api/users', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                
                if (result.success) {
                    // 如果填写了钉钉ID，更新
                    const dingtalkId = $('addDingtalkUserid').value.trim();
                    if (dingtalkId && result.user_id) {
                        await fetch(`/api/users/${result.user_id}/dingtalk`, {
                            method: 'PUT',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({dingtalk_userid: dingtalkId})
                        });
                    }
                    alert('添加成功');
                    closeAddModal();
                    loadUsers();
                } else {
                    alert('添加失败: ' + result.message);
                }
            } catch (err) {
                alert('添加失败，请稍后重试');
            }
        });
        
        // 打开编辑用户弹窗
        async function editUser(userId) {
            const user = allUsers.find(item => item.id === userId);
            if (user) {
                $('userId').value = user.id;
                $('employeeId').value = user.employee_id || '';
                $('username').value = user.username;
                $('password').value = '';
                $('password').required = false;
                $('phone').value = user.phone || '';
                $('title').value = user.title || '';
                $('startDate').value = user.start_date || '';
                $('endDate').value = user.end_date || '';
                $('dingtalkUserid').value = user.dingtalk_userid || '';
                $('modalTitle').textContent = '编辑用户: ' + user.username;
                $('editModal').classList.add('show');
            } else {
                alert('未找到该用户，请刷新后重试');
            }
        }
        
        function closeModal() {
            $('editModal').classList.remove('show');
        }
        
        // 提交编辑用户表单
        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userId = $('userId').value;
            const data = {
                employee_id: $('employeeId').value.trim(),
                username: $('username').value.trim(),
                phone: $('phone').value.trim(),
                title: $('title').value,
                start_date: $('startDate').value,
                end_date: $('endDate').value
            };
            
            // 如果填写了新密码
            const newPassword = $('password').value;
            if (newPassword) {
                data.password = newPassword;
            }
            
            try {
                const res = await fetch(`/api/users/${userId}`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                
                if (result.success) {
                    // 更新钉钉ID
                    const dingtalkId = $('dingtalkUserid').value.trim();
                    await fetch(`/api/users/${userId}/dingtalk`, {
                        method: 'PUT',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({dingtalk_userid: dingtalkId})
                    });
                    alert('保存成功');
                    closeModal();
                    loadUsers();
                } else {
                    alert('保存失败: ' + result.message);
                }
            } catch (err) {
                alert('保存失败，请稍后重试');
            }
        });
        
        // 删除用户
        async function deleteUser(id, name) {
            if (!confirm(`确定删除用户 "${name}" 吗？此操作不可恢复！`)) return;

            try {
                const res = await fetch(`/api/users/${id}`, { method: 'DELETE' });
                const data = await res.json();

                if (data.success) {
                    alert('删除成功');
                    loadUsers();
                } else {
                    alert('删除失败: ' + data.message);
                }
            } catch (err) {
                alert('删除失败，请稍后重试');
            }
        }

        // 职称到查询类型的映射
        function getQueryType(title) {
            const map = {
                '主任医师': 'sp',
                '副主任医师': 'ap',
                '护士': 'nurse',
                '麻醉医师': 'anes'
            };
            return map[title] || 'sp';
        }

        function escapeHtml(value) {
            const entities = {
                '&': '&' + 'amp;',
                '<': '&' + 'lt;',
                '>': '&' + 'gt;',
                '"': '&' + 'quot;',
                "'": '&' + '#39;'
            };
            return String(value ?? '').replace(/[&<>"']/g, char => entities[char]);
        }

        function escapeJs(value) {
            return String(value ?? '')
                .replace(/\\/g, '\\\\')
                .replace(/'/g, "\\'")
                .replace(/\r?\n/g, ' ');
        }

        // API 请求封装（与工作量查询页面一致）
        async function api(url, options = {}) {
            const res = await fetch(url, options);
            const data = await res.json();
            if (data.require_login) {
                if (confirm('登录已过期，是否跳转到登录页面？')) window.location.href = '/login';
                throw new Error('请先登录');
            }
            return data;
        }

        // 用户统计日期范围（与工作量查询页面一致：使用用户自身的统计开始/结束日期）
        function getUserStatDateRange(user) {
            const startDate = String(user.start_date || '').trim().split(' ')[0].replace(/\//g, '-');
            const endDate = String(user.end_date || '').trim().split(' ')[0].replace(/\//g, '-');
            if (!startDate || !endDate) return null;
            return { startDate, endDate };
        }

        function renderResultTable(columns, rows) {
            if (!rows.length) return '<p style="color:#666; margin-top:10px;">未查询到数据</p>';
            return `
                <div style="overflow-x: auto; margin-top: 10px;">
                    <table class="history-table">
                        <thead><tr>${columns.map(col => `<th>${escapeHtml(col)}</th>`).join('')}</tr></thead>
                        <tbody>
                            ${rows.map(row => `<tr>${row.map(cell => `<td>${escapeHtml(cell ?? '')}</td>`).join('')}</tr>`).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        // 结果框渲染：与工作量查询页面的 renderWorkloadResult 保持一致
        function renderQueryResultBox(user, label, dateRange, data) {
            const success = !!data.success;
            const rows = Array.isArray(data.rows) ? data.rows : [];
            const columns = Array.isArray(data.columns) ? data.columns : [];
            const message = data.message || (success ? '查询完成' : '查询失败');
            const pdfPath = data.pdf_path || '';
            const outputFile = data.output_file || data.xlsx_path || '';
            return `
                <div class="result-box show ${success ? 'success' : 'error'}">
                    <strong>${escapeHtml(user.username || user.employee_id || '-')} - ${label}</strong>
                    <div style="margin-top: 6px;">统计日期范围：${escapeHtml(dateRange.startDate)} 至 ${escapeHtml(dateRange.endDate)}</div>
                    <div class="result-message" style="margin-top: 6px;">${escapeHtml(message)}</div>
                    ${success ? renderResultTable(columns, rows) : ''}
                    ${success && (pdfPath || outputFile) ? `
                        <div class="btn-row">
                            <button class="btn btn-info btn-sm" onclick="openUserQueryPDF('${escapeJs(pdfPath || outputFile)}')">打开PDF</button>
                            ${outputFile ? `<button class="btn btn-success btn-sm" onclick="openPatientOutputDir()">打开输出目录</button>` : ''}
                        </div>` : ''}
                </div>
            `;
        }

        // 打开查询结果PDF（传入 pdf 或 xlsx 路径，xlsx 时按同目录 pdf 规则转换）
        async function openUserQueryPDF(filePath) {
            if (!filePath) return alert('文件路径不存在');
            const pdfPath = /\.pdf$/i.test(filePath)
                ? filePath
                : filePath.replace(/\\xls\\/g, '\\pdf\\').replace(/\/xls\//g, '/pdf/').replace('.xlsx', '.pdf');
            try {
                const formData = new FormData();
                formData.append('path', pdfPath);
                await fetch('/api/system/pdf/open', { method: 'POST', body: formData });
            } catch (err) {
                alert('无法打开PDF');
            }
        }

        function resolveUser(userId) {
            const user = allUsers.find(item => item.id === userId);
            if (!user) {
                alert('未找到该用户，请刷新后重试');
                return null;
            }
            return user;
        }

        // 住院查询 - 采用工作量查询页面的方法：按用户统计日期范围查询，结果框展示
        async function queryInpatient(userId) {
            const user = resolveUser(userId);
            if (!user) return;
            if (!user.username) return alert('该用户没有姓名，无法查询');

            const dateRange = getUserStatDateRange(user);
            if (!dateRange) return alert(`${user.username}缺少统计日期范围，请先编辑用户补全`);

            $('inpatientQueryUser').textContent = `${user.username}（${dateRange.startDate} 至 ${dateRange.endDate}）`;
            $('inpatientResultCard').style.display = 'block';
            $('inpatientLoading').style.display = 'block';
            $('inpatientResult').innerHTML = '<div class="result-box show success">住院查询中...</div>';
            $('inpatientResultCard').scrollIntoView({ behavior: 'smooth' });

            try {
                const formData = new FormData();
                formData.append('name', user.username);
                formData.append('employee_id', user.employee_id || user.username);
                formData.append('query_type', getQueryType(user.title));
                formData.append('start_date', dateRange.startDate);
                formData.append('end_date', dateRange.endDate);

                const data = await api('/api/reports/inpatient-workload', { method: 'POST', body: formData });
                $('inpatientResult').innerHTML = renderQueryResultBox(user, '住院查询', dateRange, data);
            } catch (err) {
                console.error('住院查询失败:', err);
                $('inpatientResult').innerHTML = '<div class="result-box show error">住院查询请求失败，请稍后重试</div>';
            } finally {
                $('inpatientLoading').style.display = 'none';
            }
        }

        // 门诊查询 - 采用工作量查询页面的方法：同样传入用户统计日期范围
        async function queryClinic(userId) {
            const user = resolveUser(userId);
            if (!user) return;
            if (!user.username) return alert('该用户没有姓名，无法查询');
            if (!user.employee_id) return alert('该用户没有员工编号，无法查询门诊数据');

            const dateRange = getUserStatDateRange(user);
            if (!dateRange) return alert(`${user.username}缺少统计日期范围，请先编辑用户补全`);

            $('clinicQueryUser').textContent = `${user.username}（${dateRange.startDate} 至 ${dateRange.endDate}）`;
            $('clinicResultCard').style.display = 'block';
            $('clinicLoading').style.display = 'block';
            $('clinicResult').innerHTML = '<div class="result-box show success">门诊查询中...</div>';
            $('clinicResultCard').scrollIntoView({ behavior: 'smooth' });

            try {
                const formData = new FormData();
                formData.append('doctor_name', user.username);
                formData.append('employee_id', user.employee_id);
                formData.append('start_date', dateRange.startDate);
                formData.append('end_date', dateRange.endDate);

                console.info('[门诊查询] 页面请求存储过程 Search_Doctor_OPWorkload', {
                    doctorName: user.username,
                    dateFrom: dateRange.startDate,
                    dateTo: dateRange.endDate
                });
                const data = await api('/api/reports/outpatient-workload', { method: 'POST', body: formData });

                // 门诊接口返回记录列表，统一转换为与住院查询一致的 columns/rows 结构
                const rows = (data.data || []).map(row => [
                    row['期间'] ?? '-',
                    row['医师姓名'] ?? '-',
                    row['门诊人次'] ?? 0
                ]);
                $('clinicResult').innerHTML = renderQueryResultBox(user, '门诊查询', dateRange, {
                    success: data.success,
                    message: data.message,
                    pdf_path: data.pdf_path,
                    xlsx_path: data.xlsx_path,
                    columns: ['期间', '医师姓名', '门诊人次'],
                    rows: rows
                });
            } catch (err) {
                console.error('门诊查询失败:', err);
                $('clinicResult').innerHTML = '<div class="result-box show error">门诊查询请求失败，请稍后重试</div>';
            } finally {
                $('clinicLoading').style.display = 'none';
            }
        }

        // 患者查询 - 按医生或护士姓名查询其名下患者列表
        async function queryPatients(employeeId, username, startDate, endDate, title) {
            if (!username) {
                alert('该用户没有姓名，无法查询');
                return;
            }

            $('patientQueryUser').textContent = username;
            $('patientResultCard').style.display = 'block';
            $('patientLoading').style.display = 'block';
            $('patientResult').innerHTML = '';

            // 滚动到结果区域
            $('patientResultCard').scrollIntoView({ behavior: 'smooth' });

            // 根据职称决定调用哪个API和查询类型（去除首尾空格后比较）
            const isNurse = title && title.trim() === '护士';
            const queryType = isNurse ? 'nurse' : '';

            // 默认使用本年
            const now = new Date();
            const queryStart = startDate || now.getFullYear() + '-01-01';
            const queryEnd = endDate || now.getFullYear() + '-12-31';

            try {
                const formData = new FormData();
                formData.append('name', username);
                formData.append('start_date', queryStart);
                formData.append('end_date', queryEnd);

                // 根据职称选择API：护士调用护士患者查询API，其他调用医生患者查询API
                const apiUrl = isNurse ? '/api/reports/patients/by-nurse' : '/api/reports/patients/by-doctor';
                if (isNurse) {
                    formData.append('query_type', queryType);
                }

                const res = await fetch(apiUrl, { method: 'POST', body: formData });
                const data = await res.json();

                if (data.success) {
                    if (data.rows && data.rows.length > 0) {
                        const cols = data.columns;
                        const rows = data.rows;
                        let html = `<p style="color:#28a745; font-weight:bold; margin-bottom:10px;">查询成功，共 ${data.row_count} 条记录（${queryStart} 至 ${queryEnd}）</p>`;
                        html += `<div style="max-height:500px; overflow:auto;">
                            <table style="width:100%; border-collapse:collapse;">
                                <thead style="background:#f8f9fa;"><tr>`;
                        cols.forEach(col => {
                            html += `<th style="padding:10px; border:1px solid #ddd; text-align:left; white-space:nowrap;">${col}</th>`;
                        });
                        html += `</tr></thead><tbody>`;
                        rows.forEach(row => {
                            html += '<tr>';
                            row.forEach(cell => {
                                html += `<td style="padding:8px; border:1px solid #ddd;">${cell}</td>`;
                            });
                            html += '</tr>';
                        });
                        html += '</tbody></table></div>';
                        if (data.output_file) {
                            html += `<p style="margin-top:15px;">
                                <a href="javascript:void(0)" onclick="openPatientOutputDir()">点击打开输出目录查看文件</a>
                                ${data.pdf_path ? ` | <a href="javascript:void(0)" onclick="openPatientPDF('${data.pdf_path.replace(/\\/g, '\\\\').replace(/'/g, "\\'")}')">查看PDF</a>` : ''}
                            </p>`;
                        }
                        $('patientResult').innerHTML = html;
                    } else {
                        $('patientResult').innerHTML = `<p style="color:#666;">未查询到患者数据</p>`;
                    }
                } else {
                    $('patientResult').innerHTML = `<p style="color:#dc3545;">查询失败: ${data.message || '未知错误'}</p>`;
                }
            } catch (err) {
                console.error('患者查询失败:', err);
                $('patientResult').innerHTML = '<p style="color:#dc3545;">查询失败，请稍后重试</p>';
            } finally {
                $('patientLoading').style.display = 'none';
            }
        }

        // 打开患者查询结果所在的输出目录
        async function openPatientOutputDir() {
            try { await fetch('/api/system/output-dir/open', { method: 'POST' }); } catch (err) { alert('无法打开目录'); }
        }

        // 打开患者查询结果的PDF文件
        async function openPatientPDF(pdfPath) {
            if (!pdfPath) return alert('文件路径不存在');
            try {
                const formData = new FormData();
                formData.append('path', pdfPath);
                await fetch('/api/system/pdf/open', { method: 'POST', body: formData });
            } catch (err) { alert('无法打开PDF'); }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', async () => {
            if (!await checkLogin()) return;
            loadUsers();
        });
    </script>
</body>
</html>
